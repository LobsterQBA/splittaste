[project]
name = "splittaste-pipeline"
version = "0.1.0"
description = "Reproducible MovieLens pipeline for the SplitTaste research demo"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.3.0",
  "numpy>=2.2.0",
  "pyarrow>=20.0.0",
  "scikit-learn>=1.7.0",
  "scipy>=1.15.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

