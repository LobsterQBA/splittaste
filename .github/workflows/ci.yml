name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --dev --locked
      - run: uv run ruff check pipeline tests
      - run: uv run pytest
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

